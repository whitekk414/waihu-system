<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIM 自动对话测试</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">WAIHU DIALOG POC</p>
        <h1>SIM 自动对话测试</h1>
        <p class="sub">手机外呼、预制话术、分段录音、语音识别与模型判断</p>
      </div>
      <div class="connection"><span id="connectionDot"></span><span id="connectionText">正在连接</span></div>
    </header>

    <section class="panel create-panel">
      <div>
        <h2>创建单号码测试</h2>
        <p>只允许一个中国大陆手机号；拨打前必须人工确认。</p>
      </div>
      <form id="taskForm">
        <label>测试手机号<input id="extension" placeholder="1XXXXXXXXXX" pattern="1[0-9]{10}" required></label>
        <label class="confirm"><input id="confirmed" type="checkbox" required> 我已获得授权，确认拨打该号码</label>
        <button type="submit" id="createButton">确认拨打</button>
      </form>
      <p id="formError" class="error" hidden></p>
    </section>

    <section class="grid">
      <article class="panel task-panel">
        <div class="panel-title"><h2>测试任务</h2><button class="ghost" id="refreshButton">刷新</button></div>
        <div id="taskList" class="task-list"><p class="empty">还没有测试任务</p></div>
      </article>
      <article class="panel detail-panel">
        <div class="panel-title"><h2>任务详情</h2><span id="statusBadge" class="badge">未选择</span></div>
        <div id="emptyDetail" class="empty-detail">选择左侧任务查看进度</div>
        <div id="taskDetail" hidden>
          <dl class="facts">
            <div><dt>号码</dt><dd id="detailExtension">—</dd></div>
            <div><dt>当前状态</dt><dd id="detailStatus">—</dd></div>
            <div><dt>创建时间</dt><dd id="detailCreated">—</dd></div>
          </dl>
          <h3>状态时间线</h3><ol id="timeline" class="timeline"></ol>
          <h3>对话轮次</h3><div id="turns" class="turns"><p class="empty">等待回答</p></div>
        </div>
      </article>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
