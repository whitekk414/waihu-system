server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:h2:file:./data/outbound;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

outbound:
  dialog:
    enabled: ${DIALOG_ENABLED:false}
    fixed-prompt:
      enabled: ${OUTBOUND_FIXED_PROMPT_ENABLED:false}
      playlist: ${OUTBOUND_FIXED_PROMPT_PLAYLIST:identity-question,payment-question,closing}
  telephony:
    mode: mock
    recordings-root: ${OUTBOUND_RECORDINGS_ROOT:recordings}
    ari:
      base-url: ${ASTERISK_ARI_BASE_URL:http://localhost:8088}
      username: ${ASTERISK_ARI_USER:outbound}
      password: ${ASTERISK_ARI_PASSWORD:outbound-dev-only}
  processing:
    mode: mock
    transcription: ${TRANSCRIPTION_MODE:mock}
    decision: ${DECISION_MODE:rule}
    sensevoice:
      base-url: ${SENSEVOICE_BASE_URL:http://127.0.0.1:8090}
    gpt:
      base-url: ${GPT_BASE_URL:http://uat-front.mstar.mx/model-audit-platform/api/v1/chat/completions}
      llm-env: ${GPT_LLM_ENV:UAT}
      tenant-id: ${GPT_TENANT_ID:10001}
      model: ${GPT_MODEL:openai.gpt-5.4}
      timeout-seconds: ${GPT_TIMEOUT_SECONDS:15}
