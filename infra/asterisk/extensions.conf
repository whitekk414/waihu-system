[general]
static=yes
writeprotect=yes

[from-test-phone]
exten => 7000,1,Answer()
 same => n,MixMonitor(/var/spool/asterisk/recording/${UNIQUEID}.wav)
 same => n,Playback(custom/payment-reminder)
 same => n,Wait(5)
 same => n,StopMixMonitor()
 same => n,Hangup()

[outbound-poc]
exten => _X.,1,NoOp(Outbound PoC call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
